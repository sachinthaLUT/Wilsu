<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uutinen – Willimiehen Sulka</title>
<meta name="description" content="Wilsun uutinen.">
<meta name="theme-color" content="#0B3B2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23F5D547'/%3E%3Cpath d='M13 12 L20 29 L27 12' fill='none' stroke='%230B3B2E' stroke-width='3.2'/%3E%3Ccircle cx='20' cy='30' r='3.2' fill='%230B3B2E'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
<section class="article-hero" id="hero">
  <div class="wrap">
    <a class="crumb" href="uutiset.html">Kaikki uutiset</a>
    <div class="meta" id="meta"></div>
    <h1 id="title">Ladataan…</h1>
  </div>
</section>
<article class="wrap">
  <div class="article-body" id="body"></div>
</article>
<div class="wrap" style="max-width:66ch;padding-bottom:4rem" id="after" hidden>
  <div class="share"><span>Jaa uutinen</span>
    <button class="btn btn-dark" id="share">Jaa</button>
    <button class="btn btn-line" id="copy">Kopioi linkki</button>
  </div>
  <nav class="pager" id="pager" aria-label="Muut uutiset"></nav>
</div>
</main>
<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
<script>
(async () => {
  renderChrome("uutiset");
  const C = await loadContent(); renderAlert(C);
  const id = new URLSearchParams(location.search).get("id");
  const i = C.news.findIndex(n => n.id === id);
  const hero = $("hero");
  if (i < 0){
    hero.classList.add("noimg"); hero.insertAdjacentHTML("afterbegin", DECO);
    $("title").textContent = "Uutista ei löytynyt";
    $("body").innerHTML = `<p>Uutinen on ehkä poistettu tai linkki on vanhentunut.</p><p><a href="uutiset.html">Katso kaikki uutiset</a></p>`;
    return;
  }
  const n = C.news[i];
  document.title = n.title + " – Willimiehen Sulka";
  $("title").textContent = n.title;
  $("meta").innerHTML = `<span class="cat" style="background:var(--shuttle);color:var(--deep);font-size:.8rem;font-weight:600;padding:.2rem .65rem;border-radius:999px">${esc(n.cat)}</span><time datetime="${n.date}">${D(n.date).getDate()}. ${MONTHS[D(n.date).getMonth()]} ${n.date.slice(0,4)}</time>`;
  const noImg = () => { hero.classList.add("noimg"); hero.insertAdjacentHTML("afterbegin", DECO); document.querySelector(".article-body figcaption")?.remove(); };
  if (n.image) hero.prepend(img(n.image, n.caption || "", el => { el.remove(); noImg(); }, 2000)); else noImg();
  $("body").innerHTML = (n.image && n.caption ? `<figcaption>${esc(n.caption)}</figcaption>` : "")
    + (n.summary ? `<p class="summary">${esc(n.summary)}</p>` : "") + paragraphs(n.body);
  $("after").hidden = false;
  const newer = C.news[i - 1], older = C.news[i + 1];
  $("pager").innerHTML = (older ? `<a href="uutinen.html?id=${encodeURIComponent(older.id)}"><small>Edellinen uutinen</small><b>${esc(older.title)}</b></a>` : "<span></span>")
    + (newer ? `<a class="nxt" href="uutinen.html?id=${encodeURIComponent(newer.id)}"><small>Seuraava uutinen</small><b>${esc(newer.title)}</b></a>` : "");
  const url = location.href;
  if (navigator.share) $("share").onclick = () => navigator.share({ title: n.title, url }).catch(() => {});
  else $("share").hidden = true;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(url); $("copy").textContent = "Linkki kopioitu"; }
    catch { $("copy").textContent = "Kopioi osoiteriviltä"; }
    setTimeout(() => $("copy").textContent = "Kopioi linkki", 2500);
  };
})();
</script>
</body>
</html>
