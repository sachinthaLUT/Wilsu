<body>
<main>
<section class="page-hero"><svg class="lines" viewBox="0 0 610 700" aria-hidden="true" fill="none" stroke="#1B7458" stroke-width="6"><rect x="3" y="3" width="604" height="694"/><line x1="46" y1="0" x2="46" y2="700"/><line x1="564" y1="0" x2="564" y2="700"/><line x1="0" y1="76" x2="610" y2="76"/><line x1="0" y1="472" x2="610" y2="472"/><line x1="305" y1="0" x2="305" y2="472"/><line x1="0" y1="680" x2="610" y2="680" stroke="#F5D547" stroke-width="9"/></svg>
  <div class="wrap">
    <a class="crumb" href="index.html">Etusivu</a>
    <h1>Hallitus</h1>
    <p>Wilsua pyörittävät vapaaehtoiset. Nämä ihmiset huolehtivat vuoroista, talousasioista ja seuran tapahtumista.</p>
  </div>
</section>
<section class="block" style="padding-top:3rem">
  <div class="wrap">
    <div class="board-grid" id="board"></div>
    <div class="faq-cta" style="margin-top:2.5rem">
      <p>Haluatko mukaan seuran toimintaan tai sinulla on idea? Hallitus ottaa mielellään vastaan uusia vapaaehtoisia.</p>
      <a class="btn btn-shuttle" href="mailto:puheenjohtaja@wilsu.fi">Ota yhteyttä</a>
    </div>
  </div>
</section>
</main>
<script src="assets/content.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(async () => {
  renderChrome("hallitus");
  const C = await loadContent(); afterLoad(C);
  const box = $("board");
  C.board.forEach((m, i) => {
    const lead = i === 0 && /puheenjohtaja|chair/i.test(m.role || "");
    const el = document.createElement("article");
    el.className = "member" + (lead ? " chair" : "");
    const mh = mailHref(m.email); const email = mh ? `<a href="${esc(mh)}" data-keep>${esc(m.email.trim())}</a>` : "";
    el.innerHTML = `<div class="photo"><span class="initials" aria-hidden="true">${esc(initials(m.name))}</span></div>
      <div class="info" data-keep><h3>${esc(m.name)}</h3><span class="role">${esc(m.role || "")}</span>${m.bio ? `<p>${esc(m.bio)}</p>` : ""}${email}</div>`;
    if (m.image) el.querySelector(".photo").appendChild(img(m.image, m.name, e => e.remove(), 700));
    box.appendChild(el);
  });
})();
</script>
</body>
