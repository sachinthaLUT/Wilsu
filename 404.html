<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; frame-src 'none'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://drive.google.com https://lh3.googleusercontent.com https://*.googleusercontent.com https://*.goatcounter.com; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://gc.zgo.at https://*.goatcounter.com; font-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sivua ei löytynyt – Willimiehen Sulka</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B3B2E">
<script>
  /* Works both on github.io/Wilsu/ and on the club's own domain. No query input is ever used here. */
  (function(){
    var seg = location.pathname.split("/")[1];
    window.BASE = (location.hostname.slice(-10) === "github.io" && /^[\w.-]+$/.test(seg)) ? "/" + seg + "/" : "/";
    var base = document.createElement("base"); base.href = BASE; document.head.appendChild(base);
    var css = document.createElement("link"); css.rel = "stylesheet"; css.href = BASE + "assets/style.css"; document.head.appendChild(css);
  })();
</script>
</head>
<body>
<main class="nf"><div>
  <h1>Pallo meni ulos.</h1>
  <p>Sivua ei löytynyt. Se on ehkä siirretty uuteen paikkaan sivuston uudistuksessa.</p>
  <a class="btn btn-shuttle" href="index.html">Takaisin etusivulle</a>
  <a class="btn btn-ghost" href="index.html#vuorot" style="margin-left:.5rem">Harjoitusajat</a>
</div></main>
<script>
  (function(){
    /* Old wilsu.fi addresses: send visitors to the matching page */
    var OLD = { "juniorit.php":"index.html#pelaa", "jasenlomake.php":"index.html#jasenyys", "jasenedut.php":"index.html#jasenyys",
      "galleria.php":"galleria.html", "linkit.php":"index.html#linkit", "seurainfo.php":"index.html#seura",
      "yhteystiedot.php":"hallitus.html", "index.php":"index.html" };
    var page = location.pathname.split("/").pop();
    if (Object.prototype.hasOwnProperty.call(OLD, page)){ location.replace(BASE + OLD[page]); return; }
    ["content.js","i18n.js","site.js"].forEach(function(f, i, all){
      var s = document.createElement("script");
      s.src = BASE + "assets/" + f; s.async = false;
      if (f === "site.js") s.onload = function(){ renderChrome(""); };
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
