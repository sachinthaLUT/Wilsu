<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sivua ei löytynyt – Willimiehen Sulka</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B3B2E">
<script>
  /* Works both on github.io/Wilsu/ and on your own domain */
  window.BASE = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
  document.write('<base href="' + BASE + '"><link rel="stylesheet" href="' + BASE + 'assets/style.css">');
</script>
</head>
<body>
<main class="nf"><div>
  <h1>Pallo meni ulos.</h1>
  <p>Sivua ei löytynyt. Se on ehkä siirretty uuteen paikkaan sivuston uudistuksessa.</p>
  <a class="btn btn-shuttle" href="index.html">Takaisin etusivulle</a>
  <a class="btn btn-ghost" href="index.html#vuorot" style="margin-left:.5rem">Harjoitusajat</a>
</div></main>
<script>
  ["content.js","i18n.js","site.js"].forEach(f => document.write('<script src="' + BASE + 'assets/' + f + '"><\/script>'));
</script>
<script>
  /* Old wilsu.fi addresses: send visitors to the matching section */
  const OLD = { "juniorit.php":"index.html#pelaa", "jasenlomake.php":"index.html#jasenyys", "jasenedut.php":"index.html#jasenyys",
    "galleria.php":"galleria.html", "linkit.php":"index.html#linkit", "seurainfo.php":"index.html#seura", "yhteystiedot.php":"hallitus.html", "index.php":"index.html" };
  const page = location.pathname.split("/").pop();
  if (OLD[page]) location.replace(BASE + OLD[page]);
  else renderChrome("");
</script>
</body>
</html>
