<main>
<section class="page-hero"><svg class="lines" viewBox="0 0 610 700" aria-hidden="true" fill="none" stroke="#1B7458" stroke-width="6"><rect x="3" y="3" width="604" height="694"/><line x1="46" y1="0" x2="46" y2="700"/><line x1="564" y1="0" x2="564" y2="700"/><line x1="0" y1="76" x2="610" y2="76"/><line x1="0" y1="472" x2="610" y2="472"/><line x1="305" y1="0" x2="305" y2="472"/><line x1="0" y1="680" x2="610" y2="680" stroke="#F5D547" stroke-width="9"/></svg>

    <a class="crumb" href="index.html">Etusivu</a>

    <p>Aloittamassa sulkapalloa? Tähän on koottu vastaukset yleisimpiin kysymyksiin.</p>
  </div>
</section>
<section class="block" style="padding-top:3rem">
  <div class="wrap" style="max-width:860px">
    <div class="faq" id="faq"></div>
    <div class="faq-cta">
      <p>Etkö löytänyt vastausta? Kysy meiltä suoraan.</p>

  </div>

</main>
<script src="assets/content.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(async () => {
  renderChrome("ukk");
  const C = await loadContent(); renderAlert(C);
  const groups = [];
  C.faq.forEach(f => { const g = f.topic || ""; let x = groups.find(y => y.name === g); if (!x) groups.push(x = { name: g, items: [] }); x.items.push(f); });
  $("faq").innerHTML = groups.map(g => `<div class="faq-group">${g.name ? `<h2>${esc(t(g.name))}</h2>` : ""}
    ${g.items.map(f => `<details data-keep><summary>${esc(f.q)}</summary><div class="answer">${paragraphs(f.a)}</div></details>`).join("")}</div>`).join("");
  if (location.hash){ const d = document.getElementById(location.hash.slice(1)); if (d && d.tagName === "DETAILS") d.open = true; }
})();
</script>
</body>
