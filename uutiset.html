<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uutiset – Willimiehen Sulka</title>
<meta name="description" content="Wilsun uutiset: kisamenestystä, seuran tapahtumia ja tiedotteita.">
<meta name="theme-color" content="#0B3B2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23F5D547'/%3E%3Cpath d='M13 12 L20 29 L27 12' fill='none' stroke='%230B3B2E' stroke-width='3.2'/%3E%3Ccircle cx='20' cy='30' r='3.2' fill='%230B3B2E'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
<section class="page-hero"><svg class="lines" viewBox="0 0 610 700" aria-hidden="true" fill="none" stroke="#1B7458" stroke-width="6"><rect x="3" y="3" width="604" height="694"/><line x1="46" y1="0" x2="46" y2="700"/><line x1="564" y1="0" x2="564" y2="700"/><line x1="0" y1="76" x2="610" y2="76"/><line x1="0" y1="472" x2="610" y2="472"/><line x1="305" y1="0" x2="305" y2="472"/><line x1="0" y1="680" x2="610" y2="680" stroke="#F5D547" stroke-width="9"/></svg>
  <div class="wrap">
    <a class="crumb" href="index.html">Etusivu</a>
    <h1>Uutiset</h1>
    <p>Kisamenestystä, seuran tapahtumia ja tiedotteita Lappeenrannan sulkapallokentiltä.</p>
  </div>
</section>
<section class="block" style="padding-top:2.5rem">
  <div class="wrap">
    <div class="toolbar">
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="q" placeholder="Hae uutisista" aria-label="Hae uutisista"></div>
      <div class="chips" id="chips" role="group" aria-label="Suodata aiheen mukaan"></div>
    </div>
    <div class="archive-grid" id="archive" aria-live="polite"></div>
    <div class="more"><button class="btn btn-dark" id="more" hidden>Näytä lisää uutisia</button></div>
  </div>
</section>
</main>
<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
<script>
(async () => {
  renderChrome("uutiset");
  const C = await loadContent(); renderAlert(C);
  const PAGE = 9; let shown = PAGE, cat = "Kaikki", q = "";
  const params = new URLSearchParams(location.search);
  if (params.get("aihe")) cat = params.get("aihe");
  const cats = ["Kaikki", ...new Set(C.news.map(n => n.cat))];
  const chips = $("chips");
  const drawChips = () => chips.innerHTML = cats.map(c => `<button aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  chips.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cat = b.dataset.c; shown = PAGE; drawChips(); draw(); });
  $("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); shown = PAGE; draw(); });
  $("more").addEventListener("click", () => { shown += PAGE; draw(); });
  function draw(){
    const list = C.news.filter(n => (cat === "Kaikki" || n.cat === cat) && (!q || (n.title + " " + n.summary + " " + (n.body || "")).toLowerCase().includes(q)));
    const box = $("archive"); box.innerHTML = "";
    if (!list.length){ box.innerHTML = `<p class="empty-state">Ei uutisia haulla. Kokeile toista hakusanaa tai aihetta.</p>`; $("more").hidden = true; return; }
    let year = "";
    list.slice(0, shown).forEach(n => {
      const y = n.date.slice(0, 4);
      if (y !== year){ year = y; box.insertAdjacentHTML("beforeend", `<h2 class="year-label">${y}</h2>`); }
      box.appendChild(newsCard(n, false));
    });
    $("more").hidden = list.length <= shown;
  }
  drawChips(); draw();
})();
</script>
</body>
</html>
