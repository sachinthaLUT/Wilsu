<body>
<main>
<section class="page-hero"><svg class="lines" viewBox="0 0 610 700" aria-hidden="true" fill="none" stroke="#1B7458" stroke-width="6"><rect x="3" y="3" width="604" height="694"/><line x1="46" y1="0" x2="46" y2="700"/><line x1="564" y1="0" x2="564" y2="700"/><line x1="0" y1="76" x2="610" y2="76"/><line x1="0" y1="472" x2="610" y2="472"/><line x1="305" y1="0" x2="305" y2="472"/><line x1="0" y1="680" x2="610" y2="680" stroke="#F5D547" stroke-width="9"/></svg>
  <div class="wrap">
    <a class="crumb" href="index.html">Etusivu</a>
    <h1>Tapahtumat</h1>
    <p>Seuran kisat, joukkueturnaukset ja illanvietot. Menneiden kisojen tulokset löytyvät sivun alaosasta.</p>
  </div>
</section>
<section class="block" style="padding-top:3rem">
  <div class="wrap">
    <div class="head-row"><h2>Tulossa</h2></div>
    <div id="upcoming"></div>
  </div>
</section>
<section class="block" style="padding-top:0">
  <div class="wrap">
    <div class="head-row">
      <div><h2>Menneet ja tulokset</h2><p class="lede">Kaikkien kotimaan kisojen tarkat tulokset ovat Sulkapalloliiton kisapalvelussa.</p></div>
      <a class="text-link" href="https://badmintonfinland.tournamentsoftware.com">Avaa kisapalvelu</a>
    </div>
    <div class="past" id="past"></div>
  </div>
</section>
</main>
<script src="assets/content.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(async () => {
  renderChrome("tapahtumat");
  const C = await loadContent(); afterLoad(C);
  const today = iso(new Date());
  const pin = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
  const up = C.events.filter(e => e.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  $("upcoming").innerHTML = up.map(e => {
    const d = D(e.date), link = href(e.link);
    const placeLink = e.place && !/vahvistetaan/i.test(e.place) ? `<a class="ev-place" href="${mapsUrl(e.place + ", Lappeenranta")}">${pin}${esc(e.place)}</a>` : `<span class="ev-place">${pin}${esc(e.place || t("Paikka vahvistetaan"))}</span>`;
    return `<article class="ev-card"><div class="date" data-keep>${d.getDate()}.${d.getMonth()+1}.<small>${DAYS[d.getDay()]} ${e.date.slice(0,4)}</small></div>
      <div data-keep><h3>${esc(e.title)}</h3>${e.desc ? `<p>${esc(e.desc)}</p>` : ""}${placeLink}</div>
      ${link ? `<a class="btn btn-dark" href="${link}" target="_blank" rel="noopener noreferrer">${esc(e.linkText || t("Ilmoittaudu"))}</a>` : ""}</article>`;
  }).join("") || `<p class="lede">${t("Uusia tapahtumia julkaistaan pian. Seuraa meitä Instagramissa.")}</p>`;
  const past = C.events.filter(e => e.date < today).sort((a, b) => b.date.localeCompare(a.date));
  $("past").innerHTML = past.map(e => {
    const rl = href(e.resultsLink);
    return `<div class="past-row"><time datetime="${e.date}">${fiFull(e.date)}</time>
      <div data-keep><b>${esc(e.title)}</b>${e.place ? `, ${esc(e.place)}` : ""}${e.result ? `<br><span class="res">${esc(e.result)}</span>` : ""}</div>
      ${rl ? `<a class="text-link" href="${rl}" target="_blank" rel="noopener noreferrer">${t("Tulokset")}</a>` : "<span></span>"}</div>`;
  }).join("") || `<p class="lede" style="padding-top:1rem">${t("Menneitä tapahtumia ei vielä ole.")}</p>`;
})();
</script>
</body>
</html>
