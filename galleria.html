<body>
<main>
<section class="page-hero"><svg class="lines" viewBox="0 0 610 700" aria-hidden="true" fill="none" stroke="#1B7458" stroke-width="6"><rect x="3" y="3" width="604" height="694"/><line x1="46" y1="0" x2="46" y2="700"/><line x1="564" y1="0" x2="564" y2="700"/><line x1="0" y1="76" x2="610" y2="76"/><line x1="0" y1="472" x2="610" y2="472"/><line x1="305" y1="0" x2="305" y2="472"/><line x1="0" y1="680" x2="610" y2="680" stroke="#F5D547" stroke-width="9"/></svg>
  <div class="wrap">
    <a class="crumb" href="index.html">Etusivu</a>
    <h1>Galleria</h1>
    <p>Kuvia treeneistä, seuran tapahtumista ja kisamatkoilta. Napauta kuva isoksi.</p>
  </div>
</section>
<section class="block" style="padding-top:2.5rem">
  <div class="wrap">
    <div class="toolbar"><div class="chips" id="cats" role="group" aria-label="Valitse kategoria"></div></div>
    <div class="masonry" id="grid" aria-live="polite"></div>
    <p class="empty-state" id="empty" hidden>Tässä kategoriassa ei ole vielä kuvia.</p>
  </div>
</section>
</main>
<script src="assets/content.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
(async () => {
  renderChrome("galleria");
  const C = await loadContent(); renderAlert(C);
  const present = GALLERY_CATS.filter(c => C.gallery.some(p => p.category === c));
  const want = new URLSearchParams(location.search).get("kategoria");
  let cat = present.includes(want) ? want : "Kaikki";
  function chips(){
    $("cats").innerHTML = ["Kaikki", ...present].map(c => {
      const n = c === "Kaikki" ? C.gallery.length : C.gallery.filter(p => p.category === c).length;
      return `<button aria-pressed="${c === cat}" data-c="${esc(c)}" data-keep>${esc(t(c))}<span class="cat-count">${n}</span></button>`;
    }).join("");
  }
  function draw(){
    const list = cat === "Kaikki" ? C.gallery : C.gallery.filter(p => p.category === cat);
    const grid = $("grid"); grid.innerHTML = "";
    $("empty").hidden = list.length > 0;
    list.forEach((p, i) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", `${t("Avaa kuva")} ${i + 1}/${list.length}`);
      b.appendChild(img(p.image, p.caption, () => b.classList.add("missing"), 900));
      if (p.caption || cat === "Kaikki") b.insertAdjacentHTML("beforeend", `<span class="shot-cap" data-keep>${cat === "Kaikki" ? `<span class="shot-cat">${esc(t(p.category))}</span>` : ""}${p.caption ? `<span>${esc(p.caption)}</span>` : ""}</span>`);
      b.onclick = () => openLightbox(list, i);
      grid.appendChild(b);
    });
    const u = new URL(location.href);
    if (cat === "Kaikki") u.searchParams.delete("kategoria"); else u.searchParams.set("kategoria", cat);
    history.replaceState(null, "", u);
  }
  $("cats").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cat = b.dataset.c; chips(); draw(); });
  chips(); draw();
})();
</script>
</body>
</html>
